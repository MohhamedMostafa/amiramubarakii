<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيد الأفكار | أميرة مباركي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F0E3;--ink:#171112;--wine:#5A1427;--gold:#C29A43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#171112}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 80%,#3a0f1c,var(--ink) 70%);color:var(--ivory);font-family:'Cairo','DejaVu Sans',sans-serif;display:flex;justify-content:center;overflow:hidden;touch-action:manipulation}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:14px 18px 18px;gap:12px}
.logo{height:46px;align-self:center}
h1{font-size:42px;font-weight:900;margin:0;line-height:1.3}
h2{font-size:28px;font-weight:900;margin:0;line-height:1.4}
p{font-size:19px;line-height:1.8;margin:0}
.hud{display:flex;justify-content:space-between;font-weight:800;font-size:20px;color:var(--gold)}
.field{flex:1;position:relative;overflow:hidden;user-select:none}
.arch{position:absolute;bottom:0;left:50%;width:190px;height:250px;margin-left:-95px;border-radius:95px 95px 0 0;border:4px solid var(--gold);border-bottom:0;background-size:cover;background-position:center 15%}
.arch.hit{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.b{position:absolute;top:0;padding:10px 16px;border-radius:30px;font-weight:800;font-size:17px;white-space:nowrap;cursor:pointer;border:0;font-family:inherit}
.t{background:#2b1f21;color:#cdbfbf;border:2px solid #4b3a3d}
.g{background:var(--gold);color:var(--ink)}
.pop{position:absolute;font-weight:800;color:var(--ivory);font-size:16px;pointer-events:none;animation:up .9s forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
.photo{width:170px;height:225px;border-radius:85px 85px 0 0;border:4px solid var(--gold);border-bottom:0;background-size:cover;background-position:center 15%;align-self:center}
button.go,a.btn{font-family:inherit;font-size:22px;font-weight:900;border:0;background:var(--gold);color:var(--ink);padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
button.ln{font-family:inherit;font-size:18px;font-weight:600;background:transparent;border:3px solid var(--gold);color:var(--ivory);padding:12px;width:100%;cursor:pointer}
button:focus-visible,a.btn:focus-visible,.b:focus-visible{outline:4px solid var(--ivory);outline-offset:3px}
.price{color:var(--gold);font-weight:800;font-size:18px}
.box{background:var(--wine);padding:18px;border-inline-start:8px solid var(--gold)}
@media (prefers-reduced-motion:reduce){.arch.hit,.pop{animation:none}}
</style>
</head>

function shell(h){cancelAnimationFrame(raf);clearInterval(iv);app.innerHTML='<img class="logo" src="'+LG+'" alt="Amira Mubaraki">'+h}
function intro(){
  shell('<div class="card"><div class="photo" style="background-image:url('+PH+')"></div><h1>صيد الأفكار</h1><p>أفكار التأجيل تنزل عليك من فوق. اضغطي عليها قبل ما توصل لأميرة، وصيدي الخطوات الذهبية. 25 ثانية بس.</p></div><button class="go" id="s">يلا نبدأ</button>');
  document.getElementById('s').onclick=play;
}
function play(){
  var score=0,lives=3,left=25,list=[],last=0,spawn=0;
  shell('<div class="hud"><span id="sc">خطوات 0/8</span><span id="tm">25</span><span id="lv">♥♥♥</span></div><div class="field" id="fd"><div class="arch" id="ar" style="background-image:url('+PH+')"></div></div>');
  var fd=document.getElementById('fd'),ar=document.getElementById('ar'),W=fd.clientWidth,H=fd.clientHeight;
  function hud(){document.getElementById('sc').textContent='خطوات '+score+'/8';document.getElementById('lv').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);document.getElementById('tm').textContent=left}
  function msg(x,y,t){var e=document.createElement('div');e.className='pop';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';fd.appendChild(e);setTimeout(function(){e.remove()},900)}
  function add(){
    var gold=Math.random()<0.34,b=document.createElement('button');
    b.className='b '+(gold?'g':'t');b.textContent=gold?ST[Math.random()*ST.length|0]:TH[Math.random()*TH.length|0];
    fd.appendChild(b);var x=Math.random()*(W-b.offsetWidth-8)+4;
    var o={el:b,x:x,y:-40,v:70+Math.random()*60+(25-left)*3,gold:gold};b.style.left=x+'px';list.push(o);
    b.onpointerdown=function(e){e.preventDefault();if(o.dead||over)return;o.dead=true;b.remove();
      if(gold){score++;msg(o.x,o.y,'+1 ✦');hud();if(score>=8)finish(true)}
      else msg(o.x,o.y,RE[Math.random()*RE.length|0])}
  }
  var over=false;
  function finish(w){over=true;clearInterval(iv);cancelAnimationFrame(raf);setTimeout(function(){end(w,score)},500)}
  iv=setInterval(function(){left--;hud();if(left<=0)finish(score>=8)},1000);
  function tick(t){
    if(over)return;var dt=Math.min(.05,(t-last)/1000||0);last=t;spawn+=dt;
    if(spawn>0.75){spawn=0;add()}
    list.forEach(function(o){if(o.dead)return;o.y+=o.v*dt;o.el.style.transform='translateY('+o.y+'px)';
      if(o.y>H-235){o.dead=true;o.el.remove();if(!o.gold){lives--;ar.classList.remove('hit');void ar.offsetWidth;ar.classList.add('hit');hud();if(lives<=0)finish(false)}}});
    raf=requestAnimationFrame(tick)}
  hud();raf=requestAnimationFrame(tick);
}
function end(w,s){
  var t=w?'صدتي الخطوات كلها!':s>=4?'قربتي!':'الأفكار غلبتك هالمرة';

  shell('<div class="card"><div class="photo" style="background-image:url('+PH+')"></div><h2>'+t+'</h2><p>'+s+' من 8 خطوات. '+m+'</p><div class="box"><b>جلسة هندسة الواقع</b><br><span class="price">60 دقيقة | موقف واحد | خطوة عملية وخطة 7 أيام | 249 ريال</span></div></div><a class="btn" target="_blank" rel="noopener" href="https://wa.me/966533160520?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%20%D8%A3%D9%85%D9%8A%D8%B1%D8%A9%D8%8C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%AD%D8%AC%D8%B2%20%D8%AC%D9%84%D8%B3%D8%A9%20%D9%87%D9%86%D8%AF%D8%B3%D8%A9%20%D8%A7%D9%84%D9%88%D8%A7%D9%82%D8%B9%20%D9%88%D9%85%D8%B9%D8%B1%D9%81%D8%A9%20%D8%A7%D9%84%D9%85%D9%88%D8%A7%D8%B9%D9%8A%D8%AF.">أرسلي كلمة «هندسة» عبر واتساب</a><button class="ln" id="r">العبي مرة ثانية</button>');
  document.getElementById('r').onclick=play;
}
